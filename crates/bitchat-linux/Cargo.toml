[package]
name = "bitchat-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ratatui client for BitChat Bluetooth mesh and Nostr location channels"

[dependencies]
anyhow = "1"
bitchatd = { path = "../bitchatd" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
csv = "1.4"
futures = "0.3"
geohash = "0.13"
geoutils = "0.5"
libc = "0.2"
nostr-sdk = "0.45.4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tui-input = "0.15"

[dev-dependencies]
nostr-sdk = { version = "0.45.4", features = ["local-relay"] }
